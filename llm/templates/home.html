{% extends "base.html" %}

{% block title %}Главная{% endblock %}

{% block content %}
    <div class="container-fluid mt-4">
        <!-- Верхний блок  -->
        <div class="row mb-4">
            <div class="col">
                <div class="p-3 border bg-light">
                    <h4>Параметры</h4>

                    <form id="params-form">
                        <div class="row">
                            <!-- Цепочка -->
                            <div class="col-md-4 mb-3">
                                <label for="chainSelect" class="form-label">Выберите цепочку</label>
                                <select class="form-select" id="chainSelect" name="chain" required>
                                    <option selected disabled>Выберите...</option>
                                    {% for chain in chains %}
                                        <option value="{{ chain.id }}">{{ chain.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <!-- Модель -->
                            <div class="col-md-4 mb-3">
                                <label for="modelSelect" class="form-label">Выберите модель</label>
                                <select class="form-select" id="modelSelect" name="model" required>
                                    <option selected disabled>Выберите...</option>
                                    {% for model in models %}
                                        <option value="{{ model.id }}">{{ model.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <!-- Программа -->
                            <div class="col-md-4 mb-3">
                                <label for="programSelect" class="form-label">Выберите программу</label>
                                <select class="form-select" id="programSelect" name="program" required>
                                    <option selected disabled>Выберите...</option>
                                    {% for program in programs %}
                                        <option value="{{ program.id }}">{{ program.profile }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end">
                            <button
                                class="btn btn-primary"
                                type="button"
                                id="load-button"
                                hx-get="{% url 'load_chain_inputs' %}"
                                hx-target="#input-params"
                                hx-swap="innerHTML"
                                hx-include="#params-form">
                                🔄 Загрузить параметры
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>



        <!-- Нижняя часть: деление на 2 колонки -->
        <div class="row">
            <!-- Левая колонка -->
            <div class="col-md-6 mb-4">
                <div class="p-3 border bg-white">
                    <h5>Исходные параметры</h5>
                    <div id="input-params">
                        <!-- Сюда HTMX вставит результат -->
                    </div>
                </div>
            </div>


            <!-- Правая колонка -->
            <div class="col-md-6 mb-4">
                <div class="p-3 border bg-white">
                    <h5>Результаты</h5>
                    <div id="result-block">
                        <!-- сюда прилетит результат -->
                    </div>
                </div>
            </div>

        </div>
    </div>
{% endblock %}


{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function () {
    // Удаляем устаревшее поведение
    // -- checkAndTrigger больше не нужен, т.к. теперь ручная кнопка

    // 🔁 Обработка кнопки генерации
    document.body.addEventListener('htmx:beforeRequest', function (event) {
        const button = document.getElementById('generate-button');
        if (button && event.target.closest('form#inputs-form')) {
            button.disabled = true;
            button.innerText = "Генерация...";
            const resultBlock = document.getElementById('result-block');
            if (resultBlock) {
                resultBlock.innerHTML = '<div id="result-placeholder" class="text-muted">⏳ Ожидаем результат...</div>';
            }
        }
    });

    document.body.addEventListener('htmx:afterRequest', function (event) {
        const button = document.getElementById('generate-button');
        if (button && event.target.closest('form#inputs-form')) {
            button.disabled = false;
            button.innerText = "Сгенерировать результат";
        }
    });

    // Инициализация runSelect при загрузке input-params
    function initRunSelectTrigger() {
        const runSelect = document.getElementById('runSelect');
        const loadButton = document.getElementById('load-run-button');
        if (runSelect && loadButton) {
            loadButton.disabled = true;
            runSelect.addEventListener('change', function () {
                loadButton.disabled = !runSelect.value;
            });
        }
    }

    // При подгрузке формы — инициализировать логику
    document.body.addEventListener('htmx:afterSwap', function (e) {
        if (e.target.id === "input-params") {
            initRunSelectTrigger();
        }
    });
});
</script>

{% endblock %}
